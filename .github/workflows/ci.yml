'on':
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
permissions:
    contents: read
jobs:
    code-quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php_version:
                    - 8.2
                    - 8.3
                    - 8.4
                    - 8.5
                typo3_version:
                    - 12.4
                    - 13.4
                    - 14.3
                exclude:
                    -
                        php_version: 8.4
                        typo3_version: 12.4
                    -
                        php_version: 8.5
                        typo3_version: 12.4
                    -
                        php_version: 8.5
                        typo3_version: 13.4
        steps:
            -
                name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                name: 'Install PHP'
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '${{ matrix.php_version }}'
                    coverage: none
                    tools: 'composer:v2.4'
            -
                name: 'Show Composer version'
                run: 'composer --version'
            -
                name: 'Show the Composer configuration'
                run: 'composer config --global --list'
            -
                name: 'Cache dependencies installed with composer'
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    key: 'php${{ matrix.php_version }}-typo3${{ matrix.typo3_version }}'
                    path: ~/.cache/composer
                    restore-keys: "php${{ matrix.php_version }}-composer-\n"
            -
                name: 'Install Composer dependencies'
                run: "composer require typo3/cms-core ^${{ matrix.typo3_version }} --no-progress\ncomposer install --no-progress\n"
            -
                name: 'Run command'
                run: "composer ci:static\n"
    semgrep:
        name: semgrep
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        if: "(github.actor != 'dependabot[bot]')"
        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                run: 'semgrep scan --config auto --error'
